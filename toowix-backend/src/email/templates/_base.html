<!DOCTYPE html>
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="x-apple-disable-message-reformatting">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <title>{{title}}</title>
  <!--[if mso]>
  <xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml>
  <style>
    td,th,div,p,a,h1,h2,h3,h4,h5,h6 {font-family: "Segoe UI", sans-serif; mso-line-height-rule: exactly;}
  </style>
  <![endif]-->
  <style>
    @media (max-width: 600px) {
      .sm-w-full { width: 100% !important; }
      .sm-px-6 { padding-left: 24px !important; padding-right: 24px !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; width: 100%; word-break: break-word; -webkit-font-smoothing: antialiased; background-color: #F7F8FA; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Hidden Preheader -->
  <div style="display: none; max-height: 0px; overflow: hidden; opacity: 0; font-size: 1px; line-height: 1px; color: #fff;">
    {{preheader}}
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #F7F8FA; padding: 40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" class="sm-w-full" style="max-width: 600px; background-color: #FFFFFF; border-radius: 16px; border: 1px solid #E5E7EB; overflow: hidden; box-shadow: 0 4px 12px rgba(20, 27, 43, 0.05);">
          <!-- Top Gradient Accent -->
          <tr>
            <td style="height: 6px; background: linear-gradient(90deg, #2E72B2 0%, #4F46E5 100%);"></td>
          </tr>
          <!-- Body Padding -->
          <tr>
            <td class="sm-px-6" style="padding: 36px 40px;">
              <!-- Brand Header -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom: 28px;">
                <tr>
                  <td>
                    <span style="font-size: 20px; font-weight: 700; color: #141B2B; letter-spacing: -0.5px;">Toowix <span style="color: #4F46E5;">Meet</span></span>
                  </td>
                </tr>
              </table>

              <!-- Main Heading -->
              <h1 style="margin: 0 0 16px 0; font-size: 24px; font-weight: 700; color: #141B2B; letter-spacing: -0.3px; line-height: 32px;">
                {{title}}
              </h1>

              <!-- Email Body Content -->
              <div style="font-size: 15px; line-height: 24px; color: #4B5563; margin-bottom: 8px;">
                {{content}}
              </div>

              <!-- Action Button Placeholder -->
              {{action_button}}

              <!-- Supplementary Note -->
              <p style="margin: 0; font-size: 13px; line-height: 20px; color: #9CA3AF; border-top: 1px solid #F3F4F6; padding-top: 20px;">
                If you did not make this request or believe this email was sent by mistake, please contact our support team at <a href="mailto:{{support_email}}" style="color: #4F46E5; text-decoration: none; font-weight: 500;">{{support_email}}</a>.
              </p>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td align="center" style="background-color: #F9FAFB; border-top: 1px solid #E5E7EB; padding: 20px 40px;">
              <p style="margin: 0; font-size: 12px; color: #6B7280; line-height: 18px;">
                &copy; {{current_year}} Toowix Meet. Enterprise Video Collaboration Platform &bull; <a href="{{app_url}}" target="_blank" style="color: #6B7280; text-decoration: none;">meet.toowix.com</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
