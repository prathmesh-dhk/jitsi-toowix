<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/toowix-logo.svg" />
    <link rel="alternate icon" href="/assets/toowix-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Toowix Meet — Video Meetings & Collaboration</title>

    <!-- Open Graph / link-preview card (WhatsApp, Slack, iMessage, Facebook, etc.). Same card for
    every page/meeting link -- see toowix-web-app/public/images/og-image.jpg for the source image.
    og:image must be an absolute URL: crawlers fetch it from their own servers, not the page's. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Toowix Meet" />
    <meta property="og:title" content="Toowix Meet — Video Meetings & Collaboration" />
    <meta property="og:description" content="Join a secure video meeting on Toowix Meet — connect, collaborate, and meet from anywhere." />
    <meta property="og:image" content="https://talk.toowix.com/images/og-image.jpg" />
    <meta property="og:image:width" content="1376" />
    <meta property="og:image:height" content="768" />
    <meta property="og:url" content="https://talk.toowix.com" />

    <!-- Twitter/X renders its own card tags instead of falling back to Open Graph. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Toowix Meet — Video Meetings & Collaboration" />
    <meta name="twitter:description" content="Join a secure video meeting on Toowix Meet — connect, collaborate, and meet from anywhere." />
    <meta name="twitter:image" content="https://talk.toowix.com/images/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
