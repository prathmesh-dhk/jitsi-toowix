server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # P2-10 fix (2G/3G performance plan): application/wasm was never in this list before, so the
    # 11-12MB MediaPipe WASM runtimes (public/libs/mediapipe/wasm/*) and tflite.wasm were sent
    # completely uncompressed -- the single biggest win available here for anyone on a weak
    # connection who actually turns on a virtual background. (MIME type itself needs no explicit
    # override: confirmed nginx:1.27-alpine's own default /etc/nginx/mime.types already maps
    # .wasm -> application/wasm, so WebAssembly.instantiateStreaming already works correctly --
    # adding a local `types {}` block here would have REPLACED that inherited table instead of
    # extending it, breaking every other file's MIME type in this server block.)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    # Vite fingerprints every asset filename, so a changed file is always a new URL --
    # the old one can be cached permanently.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # P2-10 fix: these are large, rarely-fetched-at-all (only loaded on demand -- MediaPipe/
    # tflite WASM+models only when a virtual background is actually turned on, noise-suppressor
    # worklet only when noise suppression is turned on) but not Vite-fingerprinted like /assets/,
    # so they used to fall through to the catch-all `location /` below and get
    # "no-cache, must-revalidate" -- a full round trip to revalidate an 11MB file on every single
    # use, including on a weak connection where that round trip itself is expensive. Content here
    # is effectively version-pinned already: scripts/verify-mediapipe-assets.cjs fails the build
    # if the MediaPipe wasm/ copy ever drifts from the installed package version, and the tflite/
    # worklet files are committed, reviewed binaries, not a mutable path. A deliberate swap still
    # works correctly -- it just needs a cache-busting rename (or a short manual purge), the same
    # tradeoff /assets/ already makes for its own "immutable" rule above.
    location /libs/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # P2-10 fix: same reasoning as /libs/ above -- preset virtual-background images are only
    # fetched when the background modal is actually opened, committed/reviewed binaries, and were
    # otherwise getting the no-cache catch-all treatment on every repeat view.
    location /images/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA routing -- any unknown path serves index.html so client-side routing
    # (react-router) handles it, instead of Nginx 404ing on a page refresh.
    # index.html must never be cached: it's the only file naming the current asset
    # hashes, so a stale cached copy would point browsers at deleted bundle files.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
