server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff
        font/woff2;

    # Vite fingerprints every asset filename, so a changed file is always a new URL --
    # the old one can be cached permanently.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA routing -- any unknown path serves index.html so client-side routing
    # (react-router) handles it, instead of Nginx 404ing on a page refresh.
    # index.html must never be cached: it's the only file naming the current asset
    # hashes, so a stale cached copy would point browsers at deleted bundle files.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
